<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOOPIN — PUBG Mobile Showreel</title>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05070b; color: white;
    font-family: Inter, Arial, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #12160f, #05070b 62%);
  }
  canvas {
    display: block;
    width: min(100vw, 177.7778vh);
    height: min(56.25vw, 100vh);
    background: #05070b;
    box-shadow: 0 0 100px #0d1408;
  }
  #controls {
    position: fixed; left: 50%; bottom: 25px; z-index: 10;
    transform: translateX(-50%);
    display: flex; gap: 10px; padding: 10px;
    border: 1px solid #ffffff20; border-radius: 14px;
    background: #090c16e8; backdrop-filter: blur(16px);
    transition: opacity .25s;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  button {
    border: 0; border-radius: 9px; padding: 12px 18px;
    background: #ff8a1e; color: #07090e;
    font: 800 13px Inter, Arial, sans-serif;
    cursor: pointer; letter-spacing: .08em;
  }
  button.secondary { background: #ffffff12; color: white; }
  button:hover { filter: brightness(1.12); }
  #hint {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: #05070bd8; backdrop-filter: blur(12px);
  }
  #hint.hidden { display: none; }
  .hint-card { width: min(480px, 90vw); text-align: center; }
  .hint-card small { color: #8b91a4; letter-spacing: .3em; }
  .hint-card h1 {
    margin: 14px 0;
    font-size: clamp(34px, 7vw, 72px);
    line-height: .85; letter-spacing: -.06em;
  }
  .hint-card p { color: #a7adbd; line-height: 1.6; }
</style>
</head>

<body>
<div id="stage">
  <canvas id="reel" width="1920" height="1080"></canvas>
</div>

<div id="hint">
  <div class="hint-card">
    <small>PUBG MOBILE / SHOWREEL 2025</small>
    <h1>KOOPIN</h1>
    <p>
      15 секунд резких вставок.<br>
      Нажмите кнопку для запуска со звуком.
    </p>
    <button id="start">ЗАПУСТИТЬ</button>
  </div>
</div>

<div id="controls" class="hidden">
  <button id="replay">ПОВТОРИТЬ</button>
  <button id="mute" class="secondary">ЗВУК: ВКЛ</button>
  <button id="full" class="secondary">ПОЛНЫЙ ЭКРАН</button>
</div>

<script>
(() => {
  "use strict";

  /* ============================================================
     DOM & CONFIG
     ============================================================ */
  const canvas = document.querySelector("#reel");
  const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
  const hint = document.querySelector("#hint");
  const controls = document.querySelector("#controls");
  const startButton = document.querySelector("#start");
  const replayButton = document.querySelector("#replay");
  const muteButton = document.querySelector("#mute");
  const fullButton = document.querySelector("#full");

  const W = canvas.width;
  const H = canvas.height;
  const DURATION = 15;
  const TAU = Math.PI * 2;

  // Жёсткие склейки — тайминги в секундах
  const CUTS = [2.8, 4.8, 6.8, 8.8, 10.6, 12.2];
  const SHOT_AT = 8.4;

  let startTime = 0;
  let animationFrame = 0;
  let running = false;
  let muted = false;

  /* ============================================================
     MATH
     ============================================================ */
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const mix = (a, b, x) => a + (b - a) * x;
  const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
  const easeIn = x => Math.pow(clamp(x), 3);
  const range = (t, a, b) => clamp((t - a) / (b - a));
  const flashAt = (t, c, w) => Math.pow(clamp(1 - Math.abs(t - c) / w), 3);
  const sceneIn = (t, cut) => easeOut(range(t, cut, cut + .22));

  const random = (seed => () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  })(91177);

  /* ============================================================
     BAKED GLOW SPRITES
     ============================================================ */
  function makeGlow(rgb, size = 64) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    rg.addColorStop(0, `rgba(${rgb},1)`);
    rg.addColorStop(.35, `rgba(${rgb},.5)`);
    rg.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = rg; g.fillRect(0, 0, size, size);
    return c;
  }
  const glowOrange = makeGlow("255,138,30");
  const glowRed    = makeGlow("255,60,60");
  const glowAmber  = makeGlow("255,200,90");
  const glowWhite  = makeGlow("255,255,255");

  /* ============================================================
     BAKED BACKGROUND (grid + dust, blitted each frame)
     ============================================================ */
  const dust = Array.from({ length: 110 }, () => ({
    x: random(), y: random(),
    z: .2 + random() * 1.6,
    size: .5 + random() * 1.6,
    phase: random() * TAU,
    tint: random() > .6 ? 1 : 0
  }));

  const bgSprite = (() => {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");

    const rg = g.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.45, W*.75);
    rg.addColorStop(0, "#12180f");
    rg.addColorStop(.5, "#0a0d08");
    rg.addColorStop(1, "#03050a");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    // Тактическая сетка
    g.strokeStyle = "rgba(120,160,90,.055)";
    g.lineWidth = 1;
    const step = 60;
    for (let x = 0; x < W; x += step) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    for (let y = 0; y < H; y += step) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }

    // Уголки HUD по краям
    g.strokeStyle = "rgba(255,138,30,.35)";
    g.lineWidth = 2;
    const m = 40, L = 70;
    for (const [cx, cy, sx, sy] of [
      [m, m, 1, 1], [W-m, m, -1, 1], [m, H-m, 1, -1], [W-m, H-m, -1, -1]
    ]) {
      g.beginPath();
      g.moveTo(cx, cy + sy * L);
      g.lineTo(cx, cy);
      g.lineTo(cx + sx * L, cy);
      g.stroke();
    }
    return c;
  })();

  /* ============================================================
     BAKED VIGNETTE
     ============================================================ */
  const vignette = (() => {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(W*.5, H*.5, H*.38, W*.5, H*.5, H*.98);
    rg.addColorStop(0, "rgba(0,0,0,0)");
    rg.addColorStop(1, "rgba(0,0,0,.82)");
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    return c;
  })();

  /* ============================================================
     SPRITE BAKER
     ============================================================ */
  function bake(w, h, drawFn) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.translate(w / 2, h / 2);
    drawFn(g);
    return c;
  }

  /* ---------------- Crosshair (persistent HUD прицел) ---------------- */
  const crosshairSprite = bake(320, 320, g => {
    const col = "#ff8a1e";
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = 4; g.lineCap = "round";
    const inner = 42, outer = 118;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      const dx = Math.cos(a), dy = Math.sin(a);
      g.beginPath();
      g.moveTo(dx * inner, dy * inner);
      g.lineTo(dx * outer, dy * outer);
      g.stroke();
    }
    g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill();
  });

  /* ---------------- Level 3 Helmet ---------------- */
  const helmetSprite = bake(560, 520, g => {
    g.beginPath();
    g.ellipse(0, 155, 160, 22, 0, 0, TAU);
    g.fillStyle = "rgba(0,0,0,.55)";
    g.fill();

    g.beginPath();
    g.moveTo(-140, 40);
    g.bezierCurveTo(-140, -120, -80, -180, 0, -180);
    g.bezierCurveTo(80, -180, 140, -120, 140, 40);
    g.lineTo(140, 90);
    g.lineTo(-140, 90);
    g.closePath();
    const hg = g.createLinearGradient(0, -180, 0, 90);
    hg.addColorStop(0, "#5e7148");
    hg.addColorStop(.5, "#3e4f30");
    hg.addColorStop(1, "#232c1a");
    g.fillStyle = hg; g.fill();

    g.fillStyle = "#2a3520";
    g.fillRect(-140, 20, 42, 70);
    g.fillRect(98, 20, 42, 70);

    g.beginPath();
    g.moveTo(-110, -20);
    g.lineTo(110, -20);
    g.lineTo(100, 25);
    g.lineTo(-100, 25);
    g.closePath();
    g.fillStyle = "#080b10";
    g.fill();

    g.fillStyle = "rgba(255,138,30,.6)";
    g.fillRect(-100, -14, 200, 3);

    g.fillStyle = "#93a37a";
    for (let i = -3; i <= 3; i++) {
      g.beginPath(); g.arc(i * 30, -100, 5, 0, TAU); g.fill();
    }

    g.strokeStyle = "#6a7a52"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, -180); g.lineTo(0, -60); g.stroke();

    g.fillStyle = "#161d10";
    g.fillRect(-140, 80, 280, 10);
  });

  /* ---------------- Assault Rifle (M416 style) ---------------- */
  const rifleSprite = bake(1140, 420, g => {
    g.fillStyle = "#1f1f22";
    g.beginPath();
    g.moveTo(-490, -20); g.lineTo(-360, -20);
    g.lineTo(-350, 30); g.lineTo(-470, 40);
    g.lineTo(-500, 10); g.closePath(); g.fill();

    g.fillRect(-370, -12, 42, 24);

    g.fillStyle = "#2a2a2e";
    g.beginPath();
    g.moveTo(-320, -30); g.lineTo(80, -30);
    g.lineTo(80, 40); g.lineTo(-160, 40);
    g.lineTo(-200, 92); g.lineTo(-262, 92);
    g.lineTo(-262, 40); g.lineTo(-320, 40);
    g.closePath(); g.fill();

    g.fillStyle = "#151517";
    g.fillRect(-320, -48, 430, 20);

    g.fillStyle = "#1f1f22";
    g.fillRect(110, -38, 250, 42);

    g.fillStyle = "#0f0f11";
    g.fillRect(360, -26, 220, 18);
    g.fillRect(580, -34, 44, 32);

    g.fillStyle = "#1a1a1c";
    g.beginPath();
    g.moveTo(-130, 40); g.lineTo(-40, 40);
    g.lineTo(-52, 145); g.lineTo(-132, 145);
    g.closePath(); g.fill();

    g.beginPath();
    g.moveTo(-250, 40); g.lineTo(-190, 40);
    g.lineTo(-205, 135); g.lineTo(-265, 135);
    g.closePath(); g.fill();

    g.fillStyle = "#080809";
    g.fillRect(-120, -115, 250, 58);
    g.fillRect(-144, -105, 32, 38);
    g.fillRect(130, -105, 32, 38);

    g.fillStyle = "rgba(255,138,30,.95)";
    g.fillRect(-116, -110, 6, 48);
    g.fillStyle = "rgba(90,200,255,.65)";
    g.fillRect(154, -110, 6, 48);

    g.fillStyle = "rgba(255,255,255,.08)";
    g.fillRect(-320, -30, 400, 3);
    g.fillRect(110, -38, 250, 3);
  });

  /* ---------------- Scope (полноэкранный прицел) ---------------- */
  const scopeSprite = bake(1000, 1000, g => {
    const R = 460;
    g.beginPath(); g.arc(0, 0, R, 0, TAU);
    g.fillStyle = "#0a0a0c"; g.fill();

    const rg = g.createRadialGradient(0, 0, 0, 0, 0, R - 40);
    rg.addColorStop(0, "rgba(0,0,0,0)");
    rg.addColorStop(.7, "rgba(10,20,30,.45)");
    rg.addColorStop(1, "rgba(0,0,0,.9)");
    g.beginPath(); g.arc(0, 0, R - 40, 0, TAU);
    g.fillStyle = rg; g.fill();

    g.strokeStyle = "rgba(255,138,30,.9)"; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-R + 80, 0); g.lineTo(-60, 0);
    g.moveTo(60, 0);     g.lineTo(R - 80, 0);
    g.moveTo(0, -R + 80); g.lineTo(0, -60);
    g.moveTo(0, 60);      g.lineTo(0, R - 80);
    g.stroke();

    g.fillStyle = "#ff8a1e";
    g.beginPath(); g.arc(0, 0, 6, 0, TAU); g.fill();

    g.strokeStyle = "rgba(255,138,30,.55)"; g.lineWidth = 2;
    for (let i = 1; i <= 4; i++) {
      const y = 80 + i * 55;
      g.beginPath(); g.moveTo(-14, y); g.lineTo(14, y); g.stroke();
    }
    g.strokeStyle = "rgba(255,138,30,.35)"; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, R - 40, 0, TAU); g.stroke();
  });

  /* ---------------- Airdrop crate + parachute ---------------- */
  const airdropSprite = bake(800, 1000, g => {
    g.beginPath();
    g.moveTo(-200, -120);
    g.quadraticCurveTo(0, -420, 200, -120);
    g.closePath();
    g.fillStyle = "#e23a3a"; g.fill();

    g.beginPath();
    g.moveTo(-200, -120);
    g.quadraticCurveTo(-60, -340, 0, -380);
    g.quadraticCurveTo(60, -340, 200, -120);
    g.closePath();
    g.fillStyle = "#f0f0f0"; g.fill();

    g.beginPath();
    g.moveTo(-60, -120);
    g.quadraticCurveTo(0, -370, 60, -120);
    g.closePath();
    g.fillStyle = "#e23a3a"; g.fill();

    g.strokeStyle = "rgba(220,220,220,.85)"; g.lineWidth = 2;
    for (const x of [-160, -80, 0, 80, 160]) {
      g.beginPath();
      g.moveTo(x, -120);
      g.lineTo(x * .3, 100);
      g.stroke();
    }

    g.fillStyle = "#c9a45a";
    g.fillRect(-180, 100, 360, 280);

    g.fillStyle = "#8a6a30";
    g.fillRect(-180, 100, 360, 18);
    g.fillRect(-180, 362, 360, 18);
    g.fillRect(-180, 100, 18, 280);
    g.fillRect(162, 100, 18, 280);

    g.fillStyle = "#cc2a2a";
    g.fillRect(-180, 220, 360, 42);

    g.fillStyle = "#2a1c08";
    g.font = "900 44px Arial";
    g.textAlign = "center";
    g.fillText("SUPPLY", 0, 195);

    g.fillStyle = "rgba(255,255,255,.08)";
    g.fillRect(-180, 100, 360, 4);
  });

  /* ---------------- Chicken Dinner ---------------- */
  const chickenSprite = bake(760, 620, g => {
    g.beginPath(); g.ellipse(0, 110, 290, 92, 0, 0, TAU);
    g.fillStyle = "#e8e4dc"; g.fill();
    g.beginPath(); g.ellipse(0, 110, 248, 74, 0, 0, TAU);
    g.fillStyle = "#f6f3eb"; g.fill();
    g.beginPath(); g.ellipse(0, 110, 210, 58, 0, 0, TAU);
    g.strokeStyle = "#c9c2b4"; g.lineWidth = 3; g.stroke();

    const cg = g.createRadialGradient(-50, -20, 10, 0, 20, 170);
    cg.addColorStop(0, "#f7c86c");
    cg.addColorStop(.6, "#c98a2c");
    cg.addColorStop(1, "#754208");
    g.beginPath(); g.ellipse(0, 20, 135, 92, 0, 0, TAU);
    g.fillStyle = cg; g.fill();

    g.beginPath(); g.ellipse(125, 65, 38, 52, .4, 0, TAU);
    g.fillStyle = "#c98828"; g.fill();
    g.beginPath(); g.ellipse(158, 102, 16, 24, .4, 0, TAU);
    g.fillStyle = "#f5f0e0"; g.fill();

    g.strokeStyle = "rgba(255,255,255,.35)";
    g.lineWidth = 6; g.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const x = -80 + i * 80;
      g.beginPath();
      g.moveTo(x, -90);
      g.bezierCurveTo(x + 22, -140, x - 22, -190, x + 10, -240);
      g.stroke();
    }
  });

  /* ============================================================
     PARTICLES (пыль/искры)
     ============================================================ */
  function drawDust(t) {
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      const speed = .015 + p.z * .025;
      let y = (p.y - t * speed) % 1;
      if (y < 0) y += 1;
      const x = (p.x + Math.sin(t * .4 + p.phase) * .015) * W;
      const py = y * H;
      const r = p.size * (5 + p.z * 12);
      const a = .10 + .35 * p.z * (.7 + .3 * Math.sin(t * 3 + p.phase));
      if (a < .03) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(p.tint ? glowOrange : glowAmber, x - r, py - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ============================================================
     ЗОНА (синее сужающееся кольцо)
     ============================================================ */
  function drawZone(t) {
    const life = clamp(t / DURATION);
    const r = mix(W * .58, W * .28, life);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.translate(W * .5, H * .5);
    ctx.strokeStyle = `rgba(90,170,255,${.14 + .1 * Math.sin(t * 1.7)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = "rgba(90,170,255,.06)";
    ctx.lineWidth = 60;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     SCENE 1 — INTRO (0 → 2.8)  — БЕЗ ПРИЦЕЛА
     ============================================================ */
  function drawIntro(t) {
    const vis = clamp(range(t, 0, .35)) * (1 - easeIn(range(t, 2.4, 2.8)));
    if (vis <= .004) return;

    const p1 = range(t, .3, 1.7);
    const outScale = 1 + easeIn(range(t, 2.4, 2.8)) * .3;

    ctx.save();
    ctx.globalAlpha = vis;
    ctx.translate(W * .5, H * .5);
    ctx.scale(outScale, outScale);

    const chars = [..."KOOPIN"];
    ctx.font = `900 260px Inter, "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    const widths = chars.map(c => ctx.measureText(c).width);
    const track = 14;
    const total = widths.reduce((a, b) => a + b, 0) + track * (chars.length - 1);
    const n = Math.max(chars.length - 1, 1);
    let x = -total / 2;

    for (let i = 0; i < chars.length; i++) {
      const cp = easeOut(clamp((p1 - (i / n) * .5) / .5));
      const w = widths[i];
      if (cp > .004) {
        ctx.save();
        ctx.globalAlpha = cp;
        ctx.translate(x + w / 2, -40 + (1 - cp) * 90);
        ctx.scale(mix(.7, 1, cp), mix(1.35, 1, cp));
        ctx.shadowColor = "rgba(255,138,30,.95)";
        ctx.shadowBlur = 40 * cp;
        ctx.fillStyle = "#ffffff";
        ctx.fillText(chars[i], -w / 2, 0);
        ctx.restore();
      }
      x += w + track;
    }

    // подзаголовок
    const p2 = range(t, .9, 2.0);
    if (p2 > .004) {
      ctx.save();
      ctx.globalAlpha = p2 * .9;
      ctx.font = `800 40px Inter, Arial, sans-serif`;
      ctx.fillStyle = "#ff8a1e";
      ctx.shadowColor = "rgba(255,138,30,.8)";
      ctx.shadowBlur = 26;
      ctx.textAlign = "center";
      ctx.fillText("PUBG MOBILE", 0, 130);
      ctx.restore();
    }

    ctx.restore();
  }

  /* ============================================================
     SCENE 2 — LEVEL 3 HELMET (2.8 → 4.8)
     ============================================================ */
  function drawHelmet(t) {
    const e = sceneIn(t, CUTS[0]);
    const out = easeIn(range(t, CUTS[1] - .15, CUTS[1]));
    const a = (1 - out);

    ctx.save();
    ctx.globalAlpha = a;

    const jitter = (1 - e) * 30;

    ctx.translate(W * .5 + (Math.random() - .5) * jitter, H * .5 + (Math.random() - .5) * jitter);
    ctx.scale(mix(1.6, 1, e), mix(1.6, 1, e));

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = a * .5;
    ctx.drawImage(glowOrange, -450, -450, 900, 900);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;

    ctx.drawImage(helmetSprite, -280, -260, 560, 520);

    const scanY = mix(-260, 260, (t - CUTS[0]) / (CUTS[1] - CUTS[0]));
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,138,30,.7)";
    ctx.fillRect(-280, scanY, 560, 4);
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();

    const tp = range(t, CUTS[0] + .15, CUTS[0] + .55);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 56px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ff8a1e";
    ctx.shadowColor = "rgba(255,138,30,.85)";
    ctx.shadowBlur = 28;
    ctx.textAlign = "center";
    const ty = H * .82 + (1 - easeOut(tp)) * 40;
    ctx.fillText("LEVEL 3 HELMET", W * .5, ty);
    ctx.font = `600 26px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#c8b48a";
    ctx.shadowBlur = 0;
    ctx.fillText("EQUIPPED", W * .5, ty + 42);
    ctx.restore();
  }

  /* ============================================================
     SCENE 3 — RIFLE (4.8 → 6.8)
     ============================================================ */
  function drawRifle(t) {
    const e = sceneIn(t, CUTS[1]);
    const out = easeIn(range(t, CUTS[2] - .15, CUTS[2]));
    const a = 1 - out;
    const localT = t - CUTS[1];

    ctx.save();
    ctx.globalAlpha = a;

    const fromX = (1 - e) * -500;
    const sway = Math.sin(localT * 1.8) * 12;

    ctx.translate(W * .5 + fromX, H * .52 + sway);
    ctx.scale(mix(.9, 1, e), mix(.9, 1, e));

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = a * .35;
    ctx.drawImage(glowOrange, -500, -250, 1000, 500);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;

    ctx.drawImage(rifleSprite, -570, -210, 1140, 420);

    const cartT = (localT * 1.4) % 1.6;
    if (cartT < .6) {
      const cx = 420 + cartT * 200;
      const cy = -80 + cartT * 220 - cartT * cartT * 260;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a * (1 - cartT / .6);
      ctx.drawImage(glowAmber, cx - 12, cy - 12, 24, 24);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = a;
    }

    ctx.restore();

    const count = 30 - Math.min(3, Math.floor(localT * 1.8));
    ctx.save();
    ctx.globalAlpha = a * .95;
    ctx.font = `900 74px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "right";
    ctx.shadowColor = "rgba(255,138,30,.9)";
    ctx.shadowBlur = 24;
    ctx.fillText(String(count).padStart(2, "0"), W * .92, H * .86);
    ctx.font = `800 30px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ff8a1e";
    ctx.shadowBlur = 0;
    ctx.fillText("/ 30", W * .92, H * .90);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 44px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ff8a1e";
    ctx.textAlign = "left";
    ctx.shadowColor = "rgba(255,138,30,.8)";
    ctx.shadowBlur = 22;
    ctx.fillText("M416", W * .08, H * .86);
    ctx.font = `600 24px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#c8b48a";
    ctx.shadowBlur = 0;
    ctx.fillText("ASSAULT RIFLE · 5.56mm", W * .08, H * .90);
    ctx.restore();
  }

  /* ============================================================
     SCENE 4 — SCOPE / SHOT (6.8 → 8.8)
     ============================================================ */
  function drawScope(t) {
    const e = sceneIn(t, CUTS[2]);
    const out = easeIn(range(t, CUTS[3] - .2, CUTS[3]));
    const a = 1 - out;
    const localT = t - CUTS[2];

    const shotT = t - SHOT_AT;
    const shake = shotT >= 0 && shotT < .35
      ? (1 - shotT / .35) * 30 : 0;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W * .5 + (Math.random() - .5) * shake,
                  H * .5 + (Math.random() - .5) * shake);

    const s = mix(2.0, 1, e);
    ctx.scale(s, s);

    ctx.fillStyle = "rgba(10,18,10,.55)";
    ctx.fillRect(-W, -H, W * 2, H * 2);

    const targetAlpha = range(t, CUTS[2] + .3, CUTS[2] + .7);
    if (targetAlpha > .004) {
      ctx.globalAlpha = a * targetAlpha;
      ctx.fillStyle = "rgba(255,138,30,.55)";

      ctx.beginPath();
      ctx.arc(0, -30, 60, 0, TAU);
      ctx.fill();
      ctx.fillRect(-55, 20, 110, 120);

      ctx.strokeStyle = "#ff8a1e";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -30, 60, 0, TAU);
      ctx.stroke();
      ctx.strokeRect(-55, 20, 110, 120);

      ctx.globalAlpha = a * targetAlpha * (.5 + .5 * Math.sin(t * 8));
      ctx.beginPath();
      ctx.arc(0, -30, 14, 0, TAU);
      ctx.fillStyle = "#ff3b3b";
      ctx.fill();
      ctx.globalAlpha = a;
    }

    ctx.drawImage(scopeSprite, -500, -500, 1000, 1000);
    ctx.restore();

    const lockT = range(t, CUTS[2] + .7, CUTS[2] + 1.1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 40px Inter, Arial, sans-serif`;
    ctx.fillStyle = shotT >= 0 ? "#ff3b3b" : "#ff8a1e";
    ctx.textAlign = "center";
    ctx.shadowColor = shotT >= 0 ? "rgba(255,60,60,.9)" : "rgba(255,138,30,.9)";
    ctx.shadowBlur = 22;
    const txt = shotT >= 0 ? "TARGET DOWN" : (lockT > .3 ? "TARGET LOCKED" : "SCANNING...");
    ctx.fillText(txt, W * .5, H * .88);
    ctx.restore();

    if (shotT >= 0 && shotT < .45) {
      const hp = 1 - shotT / .45;
      ctx.save();
      ctx.globalAlpha = hp;
      ctx.translate(W * .5, H * .5);
      ctx.strokeStyle = "#ff3b3b";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      const L = 60;
      for (const [dx, dy] of [[1,1],[-1,1],[1,-1],[-1,-1]]) {
        ctx.beginPath();
        ctx.moveTo(dx * 24, dy * 24);
        ctx.lineTo(dx * L, dy * L);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 8; i++) {
        const a2 = i * TAU / 8 + shotT * 6;
        const r = shotT * 400;
        ctx.globalAlpha = hp * .6;
        ctx.drawImage(glowRed, Math.cos(a2) * r - 30, Math.sin(a2) * r - 30, 60, 60);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.restore();
    }

    if (shotT >= 0 && shotT < .12) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = (1 - shotT / .12) * .9;
      ctx.drawImage(glowAmber, W * .5 - 400, H * .5 - 400, 800, 800);
      ctx.restore();
    }
  }

  /* ============================================================
     SCENE 5 — AIRDROP (8.8 → 10.6)
     ============================================================ */
  function drawAirdrop(t) {
    const e = sceneIn(t, CUTS[3]);
    const out = easeIn(range(t, CUTS[4] - .2, CUTS[4]));
    const a = 1 - out;
    const localT = t - CUTS[3];

    const sway = Math.sin(localT * 1.4) * 22;
    const dropY = (1 - e) * -400;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W * .5 + sway, H * .54 + dropY);

    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 6; i++) {
      const p = ((localT * .5 + i * .16) % 1);
      const px = Math.sin(i * 2 + localT) * 60;
      const py = 200 - p * 500;
      const r = 80 + p * 240;
      ctx.globalAlpha = a * (1 - p) * .45;
      ctx.drawImage(glowRed, px - r, py - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;

    ctx.drawImage(airdropSprite, -400, -500, 800, 1000);
    ctx.restore();

    const tp = range(t, CUTS[3] + .2, CUTS[3] + .6);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 60px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ff3b3b";
    ctx.shadowColor = "rgba(255,60,60,.85)";
    ctx.shadowBlur = 28;
    ctx.textAlign = "center";
    ctx.fillText("AIRDROP INCOMING", W * .5, H * .13 + (1 - easeOut(tp)) * 40);
    ctx.font = `600 24px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ffb0b0";
    ctx.shadowBlur = 0;
    ctx.fillText("ERANGEL · GRID 42-KILO", W * .5, H * .175);
    ctx.restore();
  }

  /* ============================================================
     SCENE 6 — CHICKEN DINNER (10.6 → 12.2)
     ============================================================ */
  function drawChicken(t) {
    const e = sceneIn(t, CUTS[4]);
    const out = easeIn(range(t, CUTS[5] - .15, CUTS[5]));
    const a = 1 - out;
    const localT = t - CUTS[4];

    const scale = mix(.4, 1, e);

    ctx.save();
    ctx.globalAlpha = a;

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = a * .6;
    const pul = 1 + .1 * Math.sin(localT * 6);
    ctx.drawImage(glowAmber, W * .5 - 400 * pul, H * .5 - 400 * pul, 800 * pul, 800 * pul);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;

    ctx.translate(W * .5, H * .5 + Math.sin(localT * 2) * 6);
    ctx.scale(scale, scale);
    ctx.drawImage(chickenSprite, -380, -310, 760, 620);
    ctx.restore();

    const tp = range(t, CUTS[4] + .1, CUTS[4] + .5);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 68px Inter, Arial, sans-serif`;
    ctx.fillStyle = "#ffd24a";
    ctx.shadowColor = "rgba(255,200,90,.95)";
    ctx.shadowBlur = 32;
    ctx.textAlign = "center";
    ctx.fillText("WINNER WINNER", W * .5, H * .16 + (1 - easeOut(tp)) * 40);
    ctx.fillText("CHICKEN DINNER", W * .5, H * .16 + 78);
    ctx.restore();
  }

  /* ============================================================
     SCENE 7 — FINAL LOCKUP (12.2 → 15)
     ============================================================ */
  function drawLockup(t) {
    const vis = sceneIn(t, CUTS[5]);
    if (vis <= .004) return;
    const p = range(t, CUTS[5], CUTS[5] + 1.2);

    const lw = easeOut(range(t, CUTS[5], CUTS[5] + 1.0)) * 640;
    ctx.save();
    ctx.globalAlpha = vis * .7;
    const lg = ctx.createLinearGradient(W * .5 - lw / 2, 0, W * .5 + lw / 2, 0);
    lg.addColorStop(0, "rgba(255,138,30,0)");
    lg.addColorStop(.5, "rgba(255,138,30,1)");
    lg.addColorStop(1, "rgba(255,138,30,0)");
    ctx.fillStyle = lg;
    ctx.fillRect(W * .5 - lw / 2, H * .80, lw, 2);
    ctx.restore();

    drawChars("KOOPIN", W * .5, H * .865, 92, 900, 26, p, vis,
      "#ffffff", "rgba(255,138,30,.9)");
  }

  /* ============================================================
     HUD
     ============================================================ */
  function drawHud(t) {
    const vis = clamp(range(t, .6, 1.4)) * (1 - easeIn(range(t, 14.2, 14.8)));
    if (vis <= .004) return;

    ctx.save();
    ctx.globalAlpha = vis * .8;
    ctx.font = "600 22px Inter, Arial, sans-serif";
    ctx.fillStyle = "#a89a7e";
    ctx.textBaseline = "middle";

    ctx.textAlign = "left";
    ctx.fillText("KOOPIN", 70, 70);

    ctx.textAlign = "right";
    ctx.fillText("PUBG MOBILE · SHOWREEL 2025", W - 70, 70);

    ctx.textAlign = "left";
    ctx.fillText(t.toFixed(2).padStart(5, "0") + " s", 70, H - 70);

    ctx.textAlign = "right";
    ctx.fillText("1920 × 1080 · 60 FPS", W - 70, H - 70);

    const bw = W - 140;
    ctx.fillStyle = "rgba(255,255,255,.12)";
    ctx.fillRect(70, H - 110, bw, 3);
    ctx.fillStyle = "#ff8a1e";
    ctx.fillRect(70, H - 110, bw * clamp(t / DURATION), 3);
    ctx.restore();
  }

  /* ============================================================
     ПРИЦЕЛ ПОВЕРХ ВСЕГО — НАЧИНАЯ СО 2 СЛАЙДА
     ============================================================ */
  function drawCrosshairOverlay(t) {
    // появляется ровно на склейке 2-го слайда (CUTS[0]),
    // исчезает перед финальным локапом
    const vis = clamp(range(t, CUTS[0], CUTS[0] + .4))
              * (1 - clamp(range(t, 11.8, 12.4)));
    if (vis <= .004) return;

    const pulse = 1 + .04 * Math.sin(t * 4);
    ctx.save();
    ctx.globalAlpha = vis * .7;
    ctx.translate(W * .5, H * .5);
    ctx.scale(pulse, pulse);
    ctx.drawImage(crosshairSprite, -160, -160, 320, 320);
    ctx.restore();
  }

  /* ============================================================
     ТРЯСКА НА СКЛЕЙКАХ И ВЫСТРЕЛЕ
     ============================================================ */
  function getShake(t) {
    let s = 0;
    for (const c of CUTS) {
      const d = t - c;
      if (d >= 0 && d < .22) s = Math.max(s, (1 - d / .22) * 14);
    }
    const sd = t - SHOT_AT;
    if (sd >= 0 && sd < .35) s = Math.max(s, (1 - sd / .35) * 26);
    return s;
  }

  /* ============================================================
     ВСПЫШКИ
     ============================================================ */
  function drawFlash(t) {
    let f = Math.pow(1 - range(t, 0, .5), 2) * .9;

    for (const c of CUTS) {
      const d = t - c;
      if (d >= 0 && d < .13) f = Math.max(f, 1 - d / .13);
    }

    if (t >= SHOT_AT && t < SHOT_AT + .10) {
      f = Math.max(f, (1 - (t - SHOT_AT) / .10) * .9);
    }

    if (f > .004) {
      ctx.fillStyle = `rgba(255,255,255,${f})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ============================================================
     MASTER RENDER
     ============================================================ */
  function render(t) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    ctx.drawImage(bgSprite, 0, 0);
    drawZone(t);
    drawDust(t);

    const shake = getShake(t);
    if (shake > 0) {
      ctx.save();
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    if (t < CUTS[0])       drawIntro(t);
    else if (t < CUTS[1])  drawHelmet(t);
    else if (t < CUTS[2])  drawRifle(t);
    else if (t < CUTS[3])  drawScope(t);
    else if (t < CUTS[4])  drawAirdrop(t);
    else if (t < CUTS[5])  drawChicken(t);
    else                   drawLockup(t);

    drawCrosshairOverlay(t);
    drawHud(t);

    if (shake > 0) ctx.restore();

    ctx.drawImage(vignette, 0, 0);
    drawFlash(t);
  }

  /* ============================================================
     TEXT (per-char stagger)
     ============================================================ */
  function drawChars(text, cx, cy, size, weight, tracking, progress, alpha, color, glow) {
    if (alpha <= .004) return;
    const chars = [...text];
    ctx.save();
    ctx.font = `${weight} ${size}px Inter, "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    if (glow) ctx.shadowColor = glow;

    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
    const n = Math.max(chars.length - 1, 1);
    let x = cx - total / 2;

    for (let i = 0; i < chars.length; i++) {
      const cp = easeOut(clamp((progress - (i / n) * .5) / .5));
      const w = widths[i];
      if (cp > .004) {
        ctx.save();
        ctx.globalAlpha = alpha * cp;
        ctx.translate(x + w / 2, cy + (1 - cp) * size * .45);
        ctx.scale(mix(.75, 1, cp), mix(1.3, 1, cp));
        if (glow) ctx.shadowBlur = 30 * cp;
        ctx.fillText(chars[i], -w / 2, 0);
        ctx.restore();
      }
      x += w + tracking;
    }
    ctx.restore();
  }

  /* ============================================================
     AUDIO
     ============================================================ */
  let ac = null, master = null, muteGain = null, noiseBuf = null;

  function makeNoise(sec) {
    const len = Math.floor(ac.sampleRate * sec);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function kick(time, amp, freq0 = 150) {
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq0, time);
    o.frequency.exponentialRampToValueAtTime(45, time + .18);
    g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(amp, time + .006);
    g.gain.exponentialRampToValueAtTime(.0001, time + .35);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + .40);
  }

  function hat(time, amp, dur) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8000;
    const g = ac.createGain();
    g.gain.setValueAtTime(amp, time);
    g.gain.exponentialRampToValueAtTime(.0001, time + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(time); s.stop(time + dur + .02);
  }

  function bass(time, freq, dur) {
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
    const f = ac.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = 6;
    f.frequency.setValueAtTime(1200, time);
    f.frequency.exponentialRampToValueAtTime(180, time + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(.16, time + .03);
    g.gain.exponentialRampToValueAtTime(.0001, time + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + .05);
  }

  function pad(time, dur) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(.05, time + 2.5);
    g.gain.setValueAtTime(.05, time + dur - 2.5);
    g.gain.linearRampToValueAtTime(0, time + dur);

    const f = ac.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = 2;
    f.frequency.setValueAtTime(400, time);
    f.frequency.linearRampToValueAtTime(2400, time + 7);
    f.frequency.linearRampToValueAtTime(500, time + dur);
    f.connect(g); g.connect(master);

    [110, 146.83, 164.81, 220].forEach((fr, i) => {
      const o = ac.createOscillator();
      o.type = i % 2 ? "sawtooth" : "triangle";
      o.frequency.value = fr;
      o.detune.value = (i - 1.5) * 6;
      o.connect(f);
      o.start(time); o.stop(time + dur);
    });
  }

  function click(time) {
    const o = ac.createOscillator();
    o.type = "square";
    o.frequency.setValueAtTime(1800, time);
    o.frequency.exponentialRampToValueAtTime(400, time + .04);
    const g = ac.createGain();
    g.gain.setValueAtTime(.09, time);
    g.gain.exponentialRampToValueAtTime(.0001, time + .05);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + .06);
  }

  function gunshot(time) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(4500, time);
    f.frequency.exponentialRampToValueAtTime(180, time + .28);
    const g = ac.createGain();
    g.gain.setValueAtTime(.55, time);
    g.gain.exponentialRampToValueAtTime(.0001, time + .30);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(time); s.stop(time + .35);

    kick(time, .9, 90);
  }

  function chime(time, freq, amp, dur) {
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, time);
    g.gain.exponentialRampToValueAtTime(amp, time + .02);
    g.gain.exponentialRampToValueAtTime(.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + .05);
  }

  function riser(time, dur) {
    const s = ac.createBufferSource();
    s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 3;
    f.frequency.setValueAtTime(200, time);
    f.frequency.exponentialRampToValueAtTime(6000, time + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, time);
    g.gain.linearRampToValueAtTime(.16, time + dur * .85);
    g.gain.linearRampToValueAtTime(.0001, time + dur + .15);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(time); s.stop(time + dur + .25);
  }

  function scheduleScore() {
    const t0 = ac.currentTime + .08;

    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(.80, t0 + 1.2);
    master.gain.setValueAtTime(.80, t0 + 12.4);
    master.gain.linearRampToValueAtTime(0, t0 + 14.8);

    pad(t0, DURATION);

    const BPM = 120;
    const beat = 60 / BPM;
    const beats = Math.floor(DURATION / beat);
    const roots = [55, 55, 65.41, 49];

    for (let i = 0; i < beats; i++) {
      const time = t0 + i * beat;
      const sec = i * beat;
      if (sec < .3) continue;

      kick(time, sec < 5 ? .5 : .75);
      if (i % 2 === 1) hat(time, .14, .05);
      hat(time + beat * .5, .07, .03);

      if (i % 2 === 0) {
        const root = roots[Math.floor(i / 4) % roots.length];
        bass(time, root, beat * 1.6);
      }
    }

    for (const c of CUTS) click(t0 + c);

    gunshot(t0 + SHOT_AT);

    chime(t0 + CUTS[4] + .15, 880, .09, 1.2);
    chime(t0 + CUTS[4] + .15, 1318.51, .07, 1.4);
    chime(t0 + CUTS[4] + .35, 1760, .05, 1.0);

    riser(t0 + 10.6, 1.6);

    chime(t0 + CUTS[5], 440, .07, 2.4);
    chime(t0 + CUTS[5], 659.25, .05, 2.4);
    chime(t0 + CUTS[5], 880, .04, 2.4);
  }

  function buildAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();

    master = ac.createGain(); master.gain.value = 0;
    muteGain = ac.createGain(); muteGain.gain.value = muted ? 0 : 1;

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 6;
    comp.attack.value = .003; comp.release.value = .25;

    master.connect(muteGain);
    muteGain.connect(comp);
    comp.connect(ac.destination);

    noiseBuf = makeNoise(1.5);
    scheduleScore();
  }

  function stopAudio() {
    if (ac) { try { ac.close(); } catch (e) {} }
    ac = null; master = null; muteGain = null; noiseBuf = null;
  }

  /* ============================================================
     LOOP
     ============================================================ */
  function frame(now) {
    if (!running) return;
    const t = (now - startTime) / 1000;
    render(t < DURATION ? t : DURATION);

    if (t >= DURATION) {
      running = false;
      controls.classList.remove("hidden");
      return;
    }
    animationFrame = requestAnimationFrame(frame);
  }

  /* ============================================================
     CONTROLS
     ============================================================ */
  async function startShow() {
    hint.classList.add("hidden");
    controls.classList.remove("hidden");

    stopAudio();
    try {
      buildAudio();
      if (ac && ac.state === "suspended") await ac.resume();
    } catch (e) { console.warn("Audio недоступен:", e); }

    cancelAnimationFrame(animationFrame);
    startTime = performance.now();
    running = true;
    animationFrame = requestAnimationFrame(frame);
  }

  startButton.addEventListener("click", startShow);
  replayButton.addEventListener("click", startShow);

  muteButton.addEventListener("click", () => {
    muted = !muted;
    if (muteGain) muteGain.gain.value = muted ? 0 : 1;
    muteButton.textContent = muted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ";
  });

  fullButton.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  });

  window.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      if (!running) startShow();
    }
  });

  render(0);
})();
</script>
</body>
</html>
